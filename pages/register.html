<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | Nuvora Studio</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous"
    >

    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/main.css">
</head>

<body class="bg-light">

    <!-- Navbar -->
    <header>
        <nav class="navbar navbar-expand-lg bg-white border-bottom">
            <div class="container">

                <a class="navbar-brand fw-bold" href="../index.html">
                    Nuvora Studio
                </a>

                <button
                    class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarNav"
                    aria-controls="navbarNav"
                    aria-expanded="false"
                    aria-label="Toggle navigation"
                >
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarNav">

                    <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">

                        <li class="nav-item">
                            <a class="nav-link" href="../index.html">
                                Home
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="services.html">
                                Services
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="portfolio.html">
                                Portfolio
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="about.html">
                                About
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="estimator.html">
                                Cost Estimator
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="contact.html">
                                Contact
                            </a>
                        </li>

                        <li class="nav-item ms-lg-2">
                            <a class="btn btn-dark" href="login.html">
                                Login
                            </a>
                        </li>

                    </ul>

                </div>
            </div>
        </nav>
    </header>


    <main>

        <!-- Register -->
        <section class="py-5">
            <div class="container">

                <div class="row justify-content-center">
                    <div class="col-md-8 col-lg-5">

                        <div class="card border-0 shadow-sm">

                            <div class="card-body p-4 p-lg-5">

                                <div class="text-center mb-4">

                                    <p class="text-uppercase fw-semibold mb-2">
                                        Join Nuvora
                                    </p>

                                    <h1 class="h2 fw-bold">
                                        Create Your Account
                                    </h1>

                                    <p class="text-secondary mb-0">
                                        Fill in your details to create
                                        a new account.
                                    </p>

                                </div>


                                <form id="registerForm">

                                    <!-- Name -->
                                    <div class="mb-3">

                                        <label
                                            for="registerName"
                                            class="form-label"
                                        >
                                            Full Name
                                        </label>

                                        <input
                                            type="text"
                                            class="form-control"
                                            id="registerName"
                                            name="name"
                                            autocomplete="name"
                                            placeholder="Enter your full name"
                                            required
                                        >

                                    </div>


                                    <!-- Email -->
                                    <div class="mb-3">

                                        <label
                                            for="registerEmail"
                                            class="form-label"
                                        >
                                            Email Address
                                        </label>

                                        <input
                                            type="email"
                                            class="form-control"
                                            id="registerEmail"
                                            name="email"
                                            autocomplete="email"
                                            placeholder="Enter your email"
                                            required
                                        >

                                    </div>


                                    <!-- Password -->
                                    <div class="mb-3">

                                        <label
                                            for="registerPassword"
                                            class="form-label"
                                        >
                                            Password
                                        </label>

                                        <input
                                            type="password"
                                            class="form-control"
                                            id="registerPassword"
                                            name="password"
                                            autocomplete="new-password"
                                            minlength="6"
                                            placeholder="Create a password"
                                            required
                                        >

                                    </div>


                                    <!-- Confirm Password -->
                                    <div class="mb-4">

                                        <label
                                            for="registerConfirmPassword"
                                            class="form-label"
                                        >
                                            Confirm Password
                                        </label>

                                        <input
                                            type="password"
                                            class="form-control"
                                            id="registerConfirmPassword"
                                            name="confirmPassword"
                                            autocomplete="new-password"
                                            minlength="6"
                                            placeholder="Confirm your password"
                                            required
                                        >

                                    </div>


                                    <!-- Message -->
                                    <div
                                        id="registerMessage"
                                        class="alert d-none"
                                        role="alert"
                                        aria-live="polite"
                                    ></div>


                                    <!-- Submit -->
                                    <button
                                        type="submit"
                                        class="btn btn-dark btn-lg w-100"
                                    >
                                        Create Account
                                    </button>

                                </form>


                                <p class="text-center text-secondary mt-4 mb-0">
                                    Already have an account?

                                    <a
                                        href="login.html"
                                        class="fw-semibold text-dark"
                                    >
                                        Login
                                    </a>
                                </p>

                            </div>

                        </div>


                        <p class="text-center mt-4 mb-0">

                            <a
                                href="../index.html"
                                class="text-secondary text-decoration-none"
                            >
                                ← Back to Nuvora Studio
                            </a>

                        </p>

                    </div>
                </div>

            </div>
        </section>

    </main>


    <!-- Bootstrap JS -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"
    ></script>

    <!-- Register JS -->
    <script src="../js/register.js"></script>

</body>
</html>
